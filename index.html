<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 세 줄 · 마음 일기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Caveat:wght@400;600&family=Gowun+Dodum&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #FBF7EF;
    --paper-dark: #F2EADB;
    --ink: #3D2C20;
    --ink-soft: #7A6657;
    --accent: #E8A87C;
    --shadow: 0 10px 30px rgba(80, 50, 30, 0.10), 0 2px 6px rgba(80, 50, 30, 0.06);
  }

  html, body {
    min-height: 100%;
    font-family: 'Gowun Dodum', 'Gaegu', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #FFE8D6 0%, transparent 45%),
      radial-gradient(circle at 80% 0%, #DDE5FF 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, #FFD6E8 0%, transparent 45%),
      radial-gradient(circle at 10% 90%, #D6F0FF 0%, transparent 40%),
      linear-gradient(180deg, #FFF8EE 0%, #F6EFE0 100%);
    background-attachment: fixed;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #root {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* ---------- Auth Screen ---------- */
  .auth-wrap {
    min-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    position: relative;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: 28px;
    padding: 36px 30px 30px;
    box-shadow: var(--shadow);
    border: 1.5px solid rgba(120, 90, 60, 0.12);
    position: relative;
    overflow: hidden;
  }
  .auth-card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: multiply;
  }
  .auth-card > * { position: relative; z-index: 1; }
  .auth-lang {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    background: rgba(255, 252, 246, 0.85);
    border: 1.5px solid rgba(120, 90, 60, 0.18);
    border-radius: 999px;
    padding: 3px;
    z-index: 5;
  }
  .auth-lang button {
    border: none;
    background: transparent;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: 'Caveat', cursive;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    letter-spacing: 1px;
  }
  .auth-lang button.on {
    background: var(--ink);
    color: var(--paper);
  }

  .auth-head {
    text-align: center;
    margin-bottom: 26px;
  }
  .auth-emoji {
    font-size: 56px;
    display: inline-block;
    line-height: 1;
    margin-bottom: 12px;
    animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.10));
  }
  .auth-title {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 40px;
    color: var(--ink);
    line-height: 1;
  }
  .auth-title .heart {
    color: #E76F8F;
    display: inline-block;
    transform: translateY(-3px) rotate(-12deg);
  }
  .auth-sub {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .auth-tabs {
    display: flex;
    background: rgba(245, 235, 220, 0.6);
    padding: 4px;
    border-radius: 999px;
    margin-bottom: 22px;
    border: 1.5px solid rgba(120, 90, 60, 0.12);
  }
  .auth-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px;
    border-radius: 999px;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .auth-tabs button.on {
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(80, 50, 30, 0.10);
  }

  .auth-field {
    margin-bottom: 14px;
    position: relative;
  }
  .auth-field label {
    display: block;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 4px 14px;
    letter-spacing: 0.5px;
  }
  .auth-field .input-wrap {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.7);
    border: 1.5px solid rgba(120, 90, 60, 0.18);
    border-radius: 16px;
    padding: 0 14px;
    transition: all 0.2s ease;
  }
  .auth-field .input-wrap:focus-within {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(232, 168, 124, 0.15);
  }
  .auth-field.error .input-wrap {
    border-color: #E27D7D;
    background: #FFF3F3;
  }
  .auth-field .icon {
    font-size: 18px;
    margin-right: 8px;
    line-height: 1;
  }
  .auth-field input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 14px 0;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    color: var(--ink);
  }
  .auth-field input::placeholder {
    color: rgba(122, 102, 87, 0.55);
    font-family: 'Gaegu', sans-serif;
  }

  .auth-err {
    background: #FFE8E8;
    border: 1.5px dashed #E27D7D;
    color: #B84545;
    padding: 10px 14px;
    border-radius: 14px;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    margin-bottom: 14px;
  }

  .auth-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #E8A87C 0%, #E76F8F 100%);
    color: #fff;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(231, 111, 143, 0.30);
    transition: all 0.2s ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.10);
    margin-top: 6px;
  }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(231, 111, 143, 0.40); }
  .auth-btn:active { transform: translateY(0); }
  .auth-btn:disabled {
    background: #D5CEC0;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .auth-foot {
    text-align: center;
    margin-top: 16px;
    font-family: 'Gaegu', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .auth-foot a {
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 700;
  }
  .auth-note {
    margin-top: 10px;
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 14px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  /* ---------- Header ---------- */
  header.top {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }
  .lang-toggle {
    position: absolute;
    top: 0;
    right: 4px;
    display: flex;
    background: rgba(255, 252, 246, 0.85);
    border: 1.5px solid rgba(120, 90, 60, 0.18);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(80, 50, 30, 0.08);
    z-index: 5;
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    padding: 5px 12px;
    border-radius: 999px;
    font-family: 'Caveat', cursive;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }
  .lang-toggle button.on {
    background: var(--ink);
    color: var(--paper);
  }

  .user-chip {
    position: absolute;
    top: 0;
    left: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 252, 246, 0.85);
    border: 1.5px solid rgba(120, 90, 60, 0.18);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    box-shadow: 0 2px 8px rgba(80, 50, 30, 0.08);
    font-family: 'Gaegu', sans-serif;
    font-size: 13px;
    color: var(--ink);
    font-weight: 700;
    max-width: 60%;
    z-index: 5;
  }
  .user-chip .user-mail {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 120px;
  }
  .user-chip .logout-btn {
    border: none;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: 'Gaegu', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .user-chip .logout-btn:hover { background: #E76F8F; }

  header.top h1 {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 56px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: 1px;
    margin-top: 36px;
  }
  header.top .stamp {
    display: inline-block;
    padding: 6px 18px;
    border: 1.5px dashed var(--ink-soft);
    border-radius: 999px;
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-size: 18px;
    letter-spacing: 2px;
    transform: rotate(-2deg);
    margin-bottom: 14px;
    background: rgba(255, 252, 245, 0.6);
    margin-top: 8px;
  }
  header.top h1 .heart {
    color: #E76F8F;
    display: inline-block;
    transform: translateY(-4px) rotate(-12deg);
    animation: heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: translateY(-4px) rotate(-12deg) scale(1); }
    50% { transform: translateY(-6px) rotate(-12deg) scale(1.12); }
  }
  header.top .sub {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ---------- Mood picker ---------- */
  .mood-picker {
    background: rgba(255, 252, 246, 0.85);
    border-radius: 28px;
    padding: 24px 22px 22px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    border: 1.5px solid rgba(120, 90, 60, 0.10);
    position: relative;
    overflow: hidden;
  }
  .mood-picker::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: multiply;
  }
  .mood-picker > * { position: relative; z-index: 1; }

  .mood-label {
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mood-label small {
    font-family: 'Caveat', cursive;
    font-weight: 400;
    font-size: 16px;
    color: var(--ink-soft);
  }

  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .mood-btn {
    cursor: pointer;
    border: none;
    background: rgba(255, 255, 255, 0.45);
    padding: 12px 4px 10px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.3s cubic-bezier(.34, 1.56, .64, 1);
    font-family: inherit;
    position: relative;
    overflow: visible;
  }
  .mood-btn .emoji {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.10));
    display: inline-block;
    animation: moodFloat 3.6s ease-in-out infinite;
  }
  .mood-btn:nth-child(4n+1) .emoji { animation-delay: 0s; }
  .mood-btn:nth-child(4n+2) .emoji { animation-delay: -0.9s; }
  .mood-btn:nth-child(4n+3) .emoji { animation-delay: -1.8s; }
  .mood-btn:nth-child(4n+4) .emoji { animation-delay: -2.7s; }

  @keyframes moodFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-3px) rotate(2deg); }
  }
  .mood-btn .name {
    font-family: 'Gaegu', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 2px;
  }
  .mood-btn:hover {
    background: rgba(255, 255, 255, 0.85);
    transform: translateY(-3px);
  }
  .mood-btn:hover .emoji {
    animation: moodWiggle 0.6s ease-in-out infinite;
  }
  @keyframes moodWiggle {
    0%, 100% { transform: scale(1.2) rotate(-8deg); }
    50%      { transform: scale(1.2) rotate(8deg); }
  }
  .mood-btn.active {
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.7) 100%);
    box-shadow:
      0 6px 16px rgba(80, 50, 30, 0.15),
      inset 0 0 0 2.5px var(--mood-color, var(--accent)),
      0 0 0 6px var(--mood-color-soft, rgba(255,255,255,0.4));
    transform: translateY(-3px) scale(1.04);
  }
  .mood-btn.active .name { color: var(--ink); }
  .mood-btn.active .emoji {
    animation: moodPop 0.45s cubic-bezier(.34, 1.8, .64, 1);
  }
  @keyframes moodPop {
    0%   { transform: scale(0.8) rotate(0deg); }
    50%  { transform: scale(1.35) rotate(-8deg); }
    100% { transform: scale(1.15) rotate(0deg); }
  }
  .mood-btn.active::before {
    content: '✨';
    position: absolute;
    top: -6px;
    right: -4px;
    font-size: 16px;
    animation: sparkleSpin 1.4s ease-in-out infinite;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    pointer-events: none;
  }
  .mood-btn.active::after {
    content: '♥';
    position: absolute;
    bottom: 2px;
    left: 6px;
    color: var(--mood-color, var(--accent));
    font-size: 11px;
    opacity: 0.7;
    animation: heartPulse 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sparkleSpin {
    0%, 100% { transform: scale(0.9) rotate(-15deg); opacity: 0.9; }
    50%      { transform: scale(1.2) rotate(15deg);  opacity: 1; }
  }
  @keyframes heartPulse {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  /* ---------- Form ---------- */
  .write-card {
    background: var(--paper);
    border-radius: 24px;
    padding: 28px 26px;
    box-shadow: var(--shadow);
    border: 1.5px solid rgba(120, 90, 60, 0.10);
    margin-bottom: 30px;
    position: relative;
    transition: background 0.6s ease;
    overflow: hidden;
  }
  .write-card.has-mood {
    background:
      radial-gradient(circle at 30% 20%, var(--mood-color-light, transparent) 0%, transparent 60%),
      radial-gradient(circle at 80% 90%, var(--mood-color, transparent) 0%, transparent 55%),
      var(--paper);
  }
  .write-card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.12 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: multiply;
  }
  .write-card > * { position: relative; z-index: 1; }

  .date-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    font-family: 'Caveat', cursive;
    color: var(--ink-soft);
  }
  .date-row .today {
    font-size: 26px;
    color: var(--ink);
  }
  .date-row .weather {
    font-size: 22px;
  }

  .line-input {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 0;
    border-bottom: 1.5px dashed rgba(120, 90, 60, 0.25);
  }
  .line-input:last-of-type { border-bottom: none; }
  .line-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .line-head .num {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--mood-color, var(--accent));
    font-weight: 600;
    line-height: 1;
  }
  .line-head .line-emoji {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08));
  }
  .line-head .line-name {
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  .line-input input {
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 17px;
    color: var(--ink);
    padding: 4px 4px 4px 32px;
    line-height: 1.6;
    width: 100%;
  }
  .line-input input::placeholder {
    color: rgba(122, 102, 87, 0.55);
    font-family: 'Gaegu', sans-serif;
  }

  .save-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: var(--mood-color, #E8A87C);
    color: #fff;
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(80, 50, 30, 0.15);
    transition: all 0.2s ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(80, 50, 30, 0.20); }
  .save-btn:active { transform: translateY(0); }
  .save-btn:disabled {
    background: #D5CEC0;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ---------- Diary list ---------- */
  .list-title {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 32px;
    color: var(--ink);
    margin: 36px 0 18px 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .list-title .badge {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    background: var(--ink);
    color: var(--paper);
    padding: 2px 12px;
    border-radius: 999px;
    transform: rotate(-2deg);
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-family: 'Gaegu', sans-serif;
    font-size: 18px;
  }
  .empty .big-emoji {
    font-size: 56px;
    display: block;
    margin-bottom: 14px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .diary-card {
    background: var(--paper);
    border-radius: 22px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1.5px solid rgba(120, 90, 60, 0.08);
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease;
    background:
      radial-gradient(circle at 100% 0%, var(--card-mood-light, transparent) 0%, transparent 50%),
      radial-gradient(circle at 0% 100%, var(--card-mood, transparent) 0%, transparent 50%),
      var(--paper);
  }
  .diary-card:hover { transform: translateY(-2px); }
  .diary-card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;

const STORAGE_KEY_LEGACY = 'three_line_diary_v1';
const USERS_KEY = 'three_line_diary_users';
const SESSION_KEY = 'three_line_diary_session';
const LANG_KEY = 'three_line_diary_lang';
const diaryKey = (email) => `three_line_diary_v1_${email}`;

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch (e) { return []; }
}
function saveUsers(arr) {
  localStorage.setItem(USERS_KEY, JSON.stringify(arr));
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function todayStr(lang) {
  const d = new Date();
  if (lang === 'en') {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} · ${days[d.getDay()]}`;
  }
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${days[d.getDay()]}요일`;
}

function shortDate(iso, lang) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (lang === 'en') {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]}) ${hh}:${mm}`;
  }
  const days = ['일','월','화','수','목','금','토'];
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]}) ${hh}:${mm}`;
}

function LangToggle({ lang, setLang, position = 'top-right' }) {
  return (
    <div className={position === 'auth' ? 'auth-lang' : 'lang-toggle'} role="group" aria-label="language">

    </div>
  );
}

function AuthScreen({ lang, setLang, onAuth, onToast }) {
  const t = I18N[lang];
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [contact, setContact] = useState('');
  const [err, setErr] = useState('');
  const [errField, setErrField] = useState('');
  const [busy, setBusy] = useState(false);

  function fail(msg, field) {
    setErr(msg);
    setErrField(field || '');
  }

  async function submit(e) {
    e.preventDefault();
    setErr(''); setErrField('');
    const mail = email.trim().toLowerCase();
    if (!EMAIL_RE.test(mail)) return fail(t.errInvalidEmail, 'email');
    if (pw.length < 6) return fail(t.errShortPw, 'pw');

    setBusy(true);
    try {
      const users = loadUsers();
      const hash = await sha256(pw);

      if (mode === 'signup') {
        if (!contact.trim()) { setBusy(false); return fail(t.errContact, 'contact'); }
        if (users.some(u => u.email === mail)) { setBusy(false); return fail(t.errDup, 'email'); }
        const user = { email: mail, contact: contact.trim(), pwHash: hash, createdAt: new Date().toISOString() };
        saveUsers([...users, user]);
        localStorage.setItem(SESSION_KEY, mail);
        onToast(t.okSignup);
        onAuth(user);
      } else {
        const user = users.find(u => u.email === mail);
        if (!user) { setBusy(false); return fail(t.errNoUser, 'email'); }
        if (user.pwHash !== hash) { setBusy(false); return fail(t.errBadPw, 'pw'); }
        localStorage.setItem(SESSION_KEY, mail);
        onToast(t.okLogin);
        onAuth(user);
      }
    } catch (ex) {
      console.error(ex);
      fail('Error: ' + ex.message);
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <LangToggle lang={lang} setLang={setLang} position="auth" />

        <div className="auth-head">
          <div className="auth-emoji">{t.authEmoji}</div>
          <div className="auth-title">{t.welcome}<span className="heart">♥</span></div>
          <div className="auth-sub">{t.welcomeSub}</div>
        </div>

        <div className="auth-tabs">
          <button className={mode === 'login' ? 'on' : ''} onClick={() => { setMode('login'); setErr(''); }}>{t.tabLogin}</button>
          <button className={mode === 'signup' ? 'on' : ''} onClick={() => { setMode('signup'); setErr(''); }}>{t.tabSignup}</button>
        </div>

        <form onSubmit={submit} autoComplete="on">
          <div className={`auth-field ${errField === 'email' ? 'error' : ''}`}>
            <label>{t.fieldEmail}</label>
            <div className="input-wrap">
              <span className="icon">📧</span>
              <input
                type="email"
                inputMode="email"
                autoComplete="email"
                placeholder={t.fieldEmailPh}
                value={email}
                onChange={e => setEmail(e.target.value)}
              />
            </div>
          </div>

          <div className={`auth-field ${errField === 'pw' ? 'error' : ''}`}>
            <label>{t.fieldPw}</label>
            <div className="input-wrap">
              <span className="icon">🔒</span>
              <input
                type="password"
                autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                placeholder={t.fieldPwPh}
                value={pw}
                onChange={e => setPw(e.target.value)}
              />
            </div>
          </div>

          {mode === 'signup' && (
            <div className={`auth-field ${errField === 'contact' ? 'error' : ''}`}>
              <label>{t.fieldContact}</label>
              <div className="input-wrap">
                <span className="icon">📞</span>
                <input
                  type="tel"
                  inputMode="tel"
                  autoComplete="tel"
                  placeholder={t.fieldContactPh}
                  value={contact}
                  onChange={e => setContact(e.target.value)}
                />
              </div>
            </div>
          )}

          {err && <div className="auth-err">{err}</div>}

          <button className="auth-btn" type="submit" disabled={busy}>
            {mode === 'login' ? t.btnLogin : t.btnSignup}
          </button>
        </form>

        <div className="auth-foot">
          {mode === 'login'
            ? <>{t.footLoginAsk} <a onClick={() => { setMode('signup'); setErr(''); }}>{t.footLoginGo}</a></>
            : <>{t.footSignupAsk} <a onClick={() => { setMode('login'); setErr(''); }}>{t.footSignupGo}</a></>
          }
        </div>
        <div className="auth-note">{t.note}</div>
      </div>
    </div>
  );
}

function DiaryApp({ user, onLogout, lang, setLang, onToast }) {
  const t = I18N[lang];

  const [mood, setMood] = useState(null);
  const [lines, setLines] = useState(['', '', '']);
  const [weatherIdx, setWeatherIdx] = useState(0);
  const [diaries, setDiaries] = useState([]);

  // load entries for this user (with one-time migration from legacy key)
  useEffect(() => {
    try {
      const userKey = diaryKey(user.email);
      const raw = localStorage.getItem(userKey);
      if (raw) {
        setDiaries(JSON.parse(raw));
        return;
      }
      // migrate legacy unsegmented diary into the first user only once
      const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
      if (legacy) {
        localStorage.setItem(userKey, legacy);
        localStorage.removeItem(STORAGE_KEY_LEGACY);
        setDiaries(JSON.parse(legacy));
      }
    } catch (e) {}
  }, [user.email]);

  // save entries
  useEffect(() => {
    localStorage.setItem(diaryKey(user.email), JSON.stringify(diaries));
  }, [diaries, user.email]);

  const moodObj = MOODS.find(m => m.id === mood);
  const cssVars = useMemo(() => moodObj ? {
    '--mood-color': moodObj.color,
    '--mood-color-light': moodObj.light,
  } : {}, [moodObj]);

  const canSave = mood && lines.some(l => l.trim().length > 0);

  function handleSave() {
    if (!canSave) return;
    const entry = {
      id: Date.now(),
      mood,
      weatherIdx,
      lines: lines.map(l => l.trim()),
      createdAt: new Date().toISOString(),
    };
    setDiaries([entry, ...diaries]);
    setMood(null);
    setLines(['', '', '']);
    onToast(t.toast);
  }

  function handleDelete(id) {
    if (!confirm(t.confirmDel)) return;
    setDiaries(diaries.filter(d => d.id !== id));
  }

  function handleLogout() {
    if (!confirm(t.confirmLogout)) return;
    onLogout();
  }

  return (
    <div style={cssVars}>
      <header className="top">
        <div className="user-chip">
          <span>👤</span>
          <span className="user-mail">{user.email}</span>
          <button className="logout-btn" onClick={handleLogout}>{t.logout}</button>
        </div>
        <LangToggle lang={lang} setLang={setLang} />
        <span className="stamp">{t.stamp}</span>
        <h1>{t.title}<span className="heart">♥</span></h1>
        <div className="sub">{t.sub}</div>
      </header>

      <section className="mood-picker">
        <div className="mood-label">
          {t.moodLabel} <small>{t.moodLabelSub}</small>
        </div>
        <div className="mood-grid">
          {MOODS.map(m => (
            <button
              key={m.id}
              className={`mood-btn ${mood === m.id ? 'active' : ''}`}
              style={{ '--mood-color': m.color, '--mood-color-soft': m.light }}
              onClick={() => setMood(m.id)}
              type="button"
              aria-label={lang === 'en' ? m.en : m.ko}
            >
              <span className="emoji">{m.emoji}</span>
              <span className="name">{lang === 'en' ? m.en : m.ko}</span>
            </button>
          ))}
        </div>
      </section>

      <section className={`write-card ${mood ? 'has-mood' : ''}`}>
        <div className="date-row">
          <span className="today">{todayStr(lang)}</span>
          <select
            className="weather"
            value={weatherIdx}
            onChange={e => setWeatherIdx(Number(e.target.value))}
            style={{
              border: 'none', background: 'transparent',
              fontFamily: 'Caveat, cursive', fontSize: 22,
              color: 'var(--ink-soft)', cursor: 'pointer', outline: 'none',
            }}
          >
            {WEATHERS.map((w, i) => <option key={i} value={i}>{lang === 'en' ? w.en : w.ko}</option>)}
          </select>
        </div>

        {t.lines.map((meta, i) => (
          <div key={i} className="line-input">
            <div className="line-head">
              <span className="num">{i+1}.</span>
              <span className="line-emoji">{meta.emoji}</span>
              <span className="line-name">{meta.label}</span>
            </div>
            <input
              type="text"
              maxLength={120}
              placeholder={meta.placeholder}
              value={lines[i]}
              onChange={e => {
                const next = [...lines];
                next[i] = e.target.value;
                setLines(next);
              }}
            />
          </div>
        ))}

        <button className="save-btn" onClick={handleSave} disabled={!canSave}>
          {canSave ? t.saveReady : mood ? t.saveNoLine : t.saveNoMood}
        </button>
      </section>

      <h2 className="list-title">
        {t.listTitle}
        <span className="badge">{diaries.length}{t.badgeUnit}</span>
      </h2>

      {diaries.length === 0 ? (
        <div className="empty">
          <span className="big-emoji">🌷</span>
          {t.emptyLine1}<br/>
          {t.emptyLine2}
        </div>
      ) : (
        diaries.map(d => {
          const m = MOODS.find(x => x.id === d.mood) || MOODS[0];
          const w = WEATHERS[d.weatherIdx] || WEATHERS[0];
          const moodPhrase = lang === 'en'
            ? `${m.moodLineEn} ${t.moodDaySuffix}`
            : `${m.moodLineKo} ${t.moodDaySuffix}`;
          return (
            <article
              key={d.id}
              className="diary-card"
              style={{
                '--card-mood': m.color,
                '--card-mood-light': m.light,
                '--card-mood-strong': m.color,
              }}
            >
              <div className="card-head">
                <span className="card-mood">{m.emoji}</span>
                <div className="card-meta">
                  <div className="card-date">{shortDate(d.createdAt, lang)} · {lang === 'en' ? w.en : w.ko}</div>
                  <div className="card-mood-name">{moodPhrase}</div>
                </div>
                <button className="del-btn" onClick={() => handleDelete(d.id)} title={t.delTitle}>✕</button>
              </div>
              {d.lines.map((line, i) => line && (
                <div key={i} className="card-line">
                  <div className="card-line-head">
                    <span className="card-line-emoji">{t.lines[i].emoji}</span>
                    <span>{t.lines[i].label}</span>
                  </div>
                  <div className="card-line-text">{line}</div>
                </div>
              ))}
            </article>
          );
        })
      )}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(() => {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === 'ko' || saved === 'en') return saved;
      return (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en';
    } catch (e) { return 'ko'; }
  });

  const [user, setUser] = useState(null);
  const [toast, setToast] = useState('');

  // restore session
  useEffect(() => {
    try {
      const email = localStorage.getItem(SESSION_KEY);
      if (!email) return;
      const found = loadUsers().find(u => u.email === email);
      if (found) setUser(found);
    } catch (e) {}
  }, []);

  // persist lang
  useEffect(() => {
    localStorage.setItem(LANG_KEY, lang);
    document.documentElement.lang = I18N[lang].htmlLang;
    document.title = lang === 'en' ? "Three Lines for Today · Mood Diary" : "오늘의 세 줄 · 마음 일기장";
  }, [lang]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(''), 1700);
  }

  function handleLogout() {
    localStorage.removeItem(SESSION_KEY);
    setUser(null);
  }

  return (
    <>
      {toast && <div className="toast">{toast}</div>}
      {user
        ? <DiaryApp user={user} onLogout={handleLogout} lang={lang} setLang={setLang} onToast={showToast} />
        : <AuthScreen lang={lang} setLang={setLang} onAuth={setUser} onToast={showToast} />
      }
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
