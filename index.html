<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 세 줄 · Three Lines</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFFFFF;
    --ink: #0A0A14;
    --ink-soft: #6B6B7B;
    --ink-mute: #9B9BA8;
    --line: rgba(10, 10, 20, 0.08);
    --line-strong: rgba(10, 10, 20, 0.16);
    --surface: rgba(255, 255, 255, 0.7);
    --surface-strong: rgba(255, 255, 255, 0.92);

    --hot: #FF1B6B;
    --hot-2: #FF4D8D;
    --electric: #3D5AFE;
    --cyan: #00D9FF;
    --lime: #D4FF3D;
    --orange: #FF6B35;
    --purple: #C77DFF;
    --gold: #FFD700;
    --mint: #00E5A0;

    --shadow-card: 0 16px 40px rgba(15, 15, 35, 0.06), 0 4px 12px rgba(15, 15, 35, 0.04);
    --shadow-pop: 0 24px 60px rgba(15, 15, 35, 0.10), 0 8px 24px rgba(15, 15, 35, 0.06);

    --font-ko: 'Pretendard Variable', 'Pretendard', system-ui, -apple-system, sans-serif;
    --font-en: 'Space Grotesk', 'Pretendard Variable', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  html, body {
    min-height: 100%;
    font-family: var(--font-ko);
    color: var(--ink);
    background: #FAFAFF;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 12% 8%,  #FFB6E6 0%, transparent 32%),
      radial-gradient(circle at 88% 5%,  #B5D5FF 0%, transparent 30%),
      radial-gradient(circle at 95% 92%, #B5FFEC 0%, transparent 32%),
      radial-gradient(circle at 5% 88%,  #D5B5FF 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, #FFE0B5 0%, transparent 28%);
    filter: saturate(1.15);
    animation: bgDrift 28s ease-in-out infinite alternate;
  }
  @keyframes bgDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(20px, -16px) scale(1.06); }
  }

  #root {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 100px;
  }

  ::selection { background: var(--hot); color: #fff; }

  /* ---------- Mascot: 무디 (Moody) ---------- */
  .mascot {
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(20, 10, 40, 0.12));
  }
  .mascot-wave {
    display: inline-block;
    animation: moodyWave 3.6s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  @keyframes moodyWave {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  .mascot-pulse {
    display: inline-block;
    animation: moodyPulse 2.4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes moodyPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  .mascot-sleep {
    display: inline-block;
    animation: moodySleep 3.2s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes moodySleep {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-4px) rotate(2deg); }
  }
  .mascot-zzz {
    position: absolute;
    font-family: var(--font-en);
    font-weight: 700;
    color: var(--ink-mute);
    font-size: 18px;
    animation: zzzFloat 2.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0) rotate(-8deg); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translate(18px, -26px) rotate(8deg); opacity: 0; }
  }
  .header-mascot {
    position: absolute;
    right: -6px;
    bottom: -4px;
    z-index: 4;
    pointer-events: none;
  }
  .twinkle {
    animation: twinkle 2.1s ease-in-out infinite;
    transform-origin: center;
  }
  .twinkle.t2 { animation-delay: -0.7s; }
  .twinkle.t3 { animation-delay: -1.4s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1) rotate(0); opacity: 0.9; }
    50%      { transform: scale(1.3) rotate(60deg); opacity: 1; }
  }
  @media (max-width: 480px) {
    .header-mascot { right: -8px; bottom: 0; }
  }

  /* ---------- Auth ---------- */
  .auth-wrap { min-height: calc(100vh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; position: relative; }
  .auth-card { width: 100%; max-width: 440px; background: var(--surface-strong); backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); border-radius: 32px; padding: 40px 32px 28px; box-shadow: var(--shadow-pop); border: 1px solid rgba(255, 255, 255, 0.9); position: relative; overflow: hidden; }
  .auth-card::before { content: ''; position: absolute; top: -60%; right: -30%; width: 320px; height: 320px; background: radial-gradient(circle, var(--hot), transparent 65%); opacity: 0.25; pointer-events: none; filter: blur(20px); }
  .auth-card::after { content: ''; position: absolute; bottom: -50%; left: -30%; width: 320px; height: 320px; background: radial-gradient(circle, var(--electric), transparent 65%); opacity: 0.18; pointer-events: none; filter: blur(20px); }
  .auth-card > * { position: relative; z-index: 1; }
  .auth-lang { position: absolute; top: 16px; right: 16px; display: flex; background: rgba(10, 10, 20, 0.06); border-radius: 999px; padding: 3px; z-index: 5; }
  .auth-lang button { border: none; background: transparent; padding: 5px 11px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease; }
  .auth-lang button.on { background: var(--ink); color: #fff; }
  .auth-head { margin-bottom: 28px; }
  .auth-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; background: var(--ink); color: #fff; border-radius: 999px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 16px; text-transform: uppercase; }
  .auth-tag .dot, .head-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: dotPulse 1.6s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.7); opacity: 0.6; } }
  .auth-title { font-family: var(--font-ko); font-size: 38px; font-weight: 800; color: var(--ink); line-height: 1.05; letter-spacing: -1.2px; }
  .auth-title .accent { background: linear-gradient(135deg, var(--hot), var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-sub { font-family: var(--font-en); font-size: 14px; font-weight: 500; color: var(--ink-soft); margin-top: 8px; letter-spacing: 0.2px; }
  .auth-tabs { display: flex; background: rgba(10, 10, 20, 0.05); padding: 4px; border-radius: 999px; margin-bottom: 22px; }
  .auth-tabs button { flex: 1; border: none; background: transparent; padding: 11px; border-radius: 999px; font-family: var(--font-ko); font-weight: 700; font-size: 14px; color: var(--ink-soft); cursor: pointer; transition: all 0.25s ease; }
  .auth-tabs button.on { background: var(--ink); color: #fff; box-shadow: 0 4px 12px rgba(10, 10, 20, 0.18); }
  .auth-field { margin-bottom: 12px; }
  .auth-field label { display: block; font-family: var(--font-mono); font-weight: 700; font-size: 10.5px; color: var(--ink-mute); margin: 0 0 5px 4px; letter-spacing: 1.2px; text-transform: uppercase; }
  .auth-field .input-wrap { display: flex; align-items: center; background: rgba(255, 255, 255, 0.85); border: 1.5px solid var(--line); border-radius: 16px; padding: 0 16px; transition: all 0.2s ease; }
  .auth-field .input-wrap:focus-within { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 4px rgba(10, 10, 20, 0.08); }
  .auth-field.error .input-wrap { border-color: var(--hot); background: #FFF5F8; box-shadow: 0 0 0 4px rgba(255, 27, 107, 0.10); }
  .auth-field input { flex: 1; border: none; outline: none; background: transparent; padding: 14px 0; font-family: var(--font-ko); font-size: 14.5px; font-weight: 500; color: var(--ink); }
  .auth-field input::placeholder { color: var(--ink-mute); font-weight: 400; }
  .auth-field-key { width: 26px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink-mute); text-align: left; }
  .auth-err { background: linear-gradient(135deg, rgba(255, 27, 107, 0.10), rgba(255, 77, 141, 0.06)); border: 1.5px solid var(--hot); color: var(--hot); padding: 10px 14px; border-radius: 12px; font-family: var(--font-ko); font-weight: 600; font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .auth-err::before { content: '!'; width: 18px; height: 18px; border-radius: 50%; background: var(--hot); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .auth-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--hot) 0%, var(--purple) 100%); background-size: 200% 200%; color: #fff; font-family: var(--font-ko); font-weight: 700; font-size: 15px; letter-spacing: -0.2px; cursor: pointer; box-shadow: 0 8px 24px rgba(255, 27, 107, 0.30); transition: all 0.25s cubic-bezier(.4, 1.4, .6, 1); margin-top: 8px; position: relative; overflow: hidden; }
  .auth-btn::after { content: '→'; margin-left: 8px; display: inline-block; transition: transform 0.25s ease; font-family: var(--font-en); font-weight: 500; }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 27, 107, 0.40); background-position: 100% 50%; }
  .auth-btn:hover::after { transform: translateX(4px); }
  .auth-btn:active { transform: translateY(0); }
  .auth-btn:disabled { background: var(--ink-mute); cursor: not-allowed; transform: none; box-shadow: none; }
  .auth-foot { text-align: center; margin-top: 18px; font-family: var(--font-ko); font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .auth-foot a { color: var(--ink); cursor: pointer; font-weight: 700; border-bottom: 2px solid var(--lime); padding-bottom: 1px; transition: all 0.2s ease; }
  .auth-foot a:hover { color: var(--hot); border-bottom-color: var(--hot); }
  .auth-note { margin-top: 14px; text-align: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); letter-spacing: 0.8px; }

  /* ---------- Header ---------- */
  header.top { margin-bottom: 28px; position: relative; padding-top: 50px; }
  .lang-toggle { position: absolute; top: 0; right: 0; display: flex; background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; padding: 3px; z-index: 5; }
  .lang-toggle button { border: none; background: transparent; padding: 5px 12px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink-soft); cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px; }
  .lang-toggle button.on { background: var(--ink); color: #fff; }
  .user-chip { position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; font-family: var(--font-ko); font-size: 12px; color: var(--ink); font-weight: 600; max-width: 70%; z-index: 5; }
  .user-chip .user-avatar { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--hot), var(--purple)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-mono); font-size: 9px; font-weight: 700; }
  .user-chip .user-mail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; font-family: var(--font-mono); font-size: 11px; }
  .user-chip .logout-btn { border: none; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 10px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; cursor: pointer; letter-spacing: 0.8px; text-transform: uppercase; transition: all 0.2s ease; }
  .user-chip .logout-btn:hover { background: var(--hot); }
  .head-tag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; background: var(--ink); color: #fff; border-radius: 999px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 14px; text-transform: uppercase; }
  header.top h1 { font-family: var(--font-ko); font-size: 54px; font-weight: 800; color: var(--ink); line-height: 1.0; letter-spacing: -1.8px; margin-bottom: 6px; }
  header.top h1 .accent { background: linear-gradient(135deg, var(--hot) 0%, var(--electric) 60%, var(--cyan) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 6s ease-in-out infinite; background-size: 200% 200%; }
  @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  header.top .sub { font-family: var(--font-en); font-size: 15px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.2px; }

  .glass { background: var(--surface-strong); backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 28px; box-shadow: var(--shadow-card); }

  /* ---------- View Tabs (My / Open) ---------- */
  .view-tabs {
    display: flex;
    background: var(--surface-strong);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-card);
  }
  .view-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 16px;
    border-radius: 999px;
    font-family: var(--font-ko);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(.4, 1.4, .6, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .view-tabs button .cnt {
    font-family: var(--font-mono);
    font-size: 10.5px;
    background: rgba(10, 10, 20, 0.10);
    color: var(--ink-soft);
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .view-tabs button.on {
    background: var(--ink);
    color: #fff;
    box-shadow: 0 6px 16px rgba(10, 10, 20, 0.18);
  }
  .view-tabs button.on .cnt {
    background: rgba(255,255,255,0.20);
    color: #fff;
  }
  .view-tabs button.on .live-dot {
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-mute);
    animation: dotPulse 1.6s ease-in-out infinite;
  }

  /* ---------- Mood picker ---------- */
  .mood-picker { padding: 22px 22px 20px; margin-bottom: 18px; }
  .mood-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .mood-label .l { font-family: var(--font-ko); font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: -0.3px; }
  .mood-label .r { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); letter-spacing: 1.2px; text-transform: uppercase; }

  /* Category chips */
  .mood-cats {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .mood-cats::-webkit-scrollbar { display: none; }
  .mood-cat {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: rgba(255, 255, 255, 0.5);
    font-family: var(--font-ko);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s cubic-bezier(.34, 1.4, .64, 1);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .mood-cat .cat-emoji { font-size: 14px; }
  .mood-cat .cat-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-mute);
    margin-left: 2px;
  }
  .mood-cat:hover {
    background: #fff;
    border-color: var(--ink);
    color: var(--ink);
    transform: translateY(-1px);
  }
  .mood-cat.on {
    background: linear-gradient(135deg, var(--cat-color, var(--hot)), var(--cat-end, var(--purple)));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 16px var(--cat-shadow, rgba(255, 27, 107, 0.30));
    transform: translateY(-1px);
  }
  .mood-cat.on .cat-count { color: rgba(255,255,255,0.85); }

  .mood-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mood-btn { cursor: pointer; border: 1.5px solid transparent; background: rgba(255, 255, 255, 0.4); padding: 14px 4px 10px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.35s cubic-bezier(.34, 1.56, .64, 1); font-family: inherit; position: relative; overflow: hidden; }
  .mood-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--mood-color, var(--hot)), var(--mood-end, var(--purple))); opacity: 0; transition: opacity 0.4s ease; z-index: 0; }
  .mood-btn > * { position: relative; z-index: 1; }
  .mood-btn .emoji { font-size: 30px; line-height: 1; display: inline-block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.10)); animation: moodFloat 3.6s ease-in-out infinite; }
  .mood-btn:nth-child(4n+1) .emoji { animation-delay: 0s; }
  .mood-btn:nth-child(4n+2) .emoji { animation-delay: -0.9s; }
  .mood-btn:nth-child(4n+3) .emoji { animation-delay: -1.8s; }
  .mood-btn:nth-child(4n+4) .emoji { animation-delay: -2.7s; }
  @keyframes moodFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  .mood-btn .name { font-family: var(--font-ko); font-size: 11.5px; color: var(--ink-soft); font-weight: 700; margin-top: 2px; letter-spacing: -0.2px; transition: color 0.3s ease; }
  .mood-btn:hover { transform: translateY(-4px); border-color: var(--mood-color, var(--hot)); background: #fff; }
  .mood-btn:hover .emoji { animation: moodWiggle 0.5s ease-in-out infinite; }
  @keyframes moodWiggle { 0%, 100% { transform: scale(1.2) rotate(-10deg); } 50% { transform: scale(1.2) rotate(10deg); } }
  .mood-btn.active { transform: translateY(-4px) scale(1.04); border-color: transparent; box-shadow: 0 12px 28px var(--mood-color-shadow, rgba(255, 27, 107, 0.30)); }
  .mood-btn.active::before { opacity: 1; }
  .mood-btn.active .name { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  .mood-btn.active .emoji { animation: moodPop 0.5s cubic-bezier(.34, 1.8, .64, 1); filter: drop-shadow(0 3px 6px rgba(0,0,0,0.20)); }
  @keyframes moodPop { 0% { transform: scale(0.85) rotate(0); } 50% { transform: scale(1.4) rotate(-8deg); } 100% { transform: scale(1.15) rotate(0); } }

  /* ---------- Write Card ---------- */
  .write-card { padding: 28px 26px; margin-bottom: 28px; position: relative; overflow: hidden; transition: all 0.6s ease; }
  .write-card.has-mood { box-shadow: var(--shadow-pop), 0 0 0 1px var(--mood-color, var(--hot)); }
  .write-card.has-mood::before { content: ''; position: absolute; top: -50%; right: -30%; width: 380px; height: 380px; background: radial-gradient(circle, var(--mood-color, var(--hot)), transparent 65%); opacity: 0.15; pointer-events: none; filter: blur(20px); z-index: 0; }
  .write-card > * { position: relative; z-index: 1; }
  .date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .date-row .today { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--ink); letter-spacing: 1px; background: rgba(10, 10, 20, 0.05); padding: 6px 12px; border-radius: 999px; border: none; outline: none; cursor: pointer; transition: all 0.2s ease; color-scheme: light; }
  .date-row .today:hover { background: rgba(10, 10, 20, 0.10); }
  .date-row .today:focus { background: rgba(10, 10, 20, 0.12); box-shadow: 0 0 0 3px rgba(255, 27, 107, 0.18); }
  .date-row .today::-webkit-calendar-picker-indicator { opacity: 0.55; cursor: pointer; margin-left: 4px; padding: 0; }
  .date-row .today.past { background: linear-gradient(135deg, rgba(255, 27, 107, 0.14), rgba(199, 125, 255, 0.14)); color: var(--hot); }
  .date-row .weather { font-family: var(--font-ko); font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; background: rgba(10, 10, 20, 0.05); padding: 6px 12px; border-radius: 999px; border: none; outline: none; transition: all 0.2s ease; }
  .date-row .weather:hover { background: rgba(10, 10, 20, 0.10); }
  .line-input { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

async function pantryGet() {
  try {
    const r = await fetch(PANTRY_URL, { method: 'GET' });
    if (r.status === 400) return null; // basket not yet created
    if (!r.ok) throw new Error('GET ' + r.status);
    return await r.json();
  } catch (e) { console.warn('pantryGet', e.message); return null; }
}
async function pantryPut(data) {
  try {
    const r = await fetch(PANTRY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error('POST ' + r.status);
    return true;
  } catch (e) { console.warn('pantryPut', e.message); return false; }
}

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

  const en = ['Cafer','OfficeOne','BookCover','OffLight','DawnRunner','PostShift','3PM','CoffeeLover','AtDesk','OnTheRun','Routinist','FreshStart','DailyIssue','SeedYou','SoloCoder'];
  const arr = lang === 'en' ? en : ko;
  const idx = seed % arr.length;
  const num = (seed * 7) % 9999;
  return `${arr[idx]}${String(num).padStart(4, '0')}`;
}

  return arr[seed % arr.length];
}

    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    return `${months[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')} · ${days[d.getDay()]}`;
  }
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${days[d.getDay()]}`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function exportToXlsx(diaries, lang, t) {
  if (!diaries.length) return;
  if (typeof XLSX === 'undefined') {
    alert(lang === 'en' ? 'Excel library not loaded yet, try again in a moment.' : 'Excel 라이브러리 로드 전이에요. 잠시 후 다시 시도해주세요.');
    return;
  }
  const headerDate = lang === 'en' ? 'Date' : '날짜';
  const headerMood = lang === 'en' ? 'Mood' : '무드';
  const headerWeather = lang === 'en' ? 'Weather' : '날씨';
  const col1 = `${t.lines[0].emoji} ${t.lines[0].label}`;
  const col2 = `${t.lines[1].emoji} ${t.lines[1].label}`;
  const col3 = `${t.lines[2].emoji} ${t.lines[2].label}`;
  const rows = diaries.map(d => {
    const m = MOODS.find(x => x.id === d.mood) || {};
    const w = WEATHERS[d.weatherIdx] || {};
    return {
      [headerDate]: shortDate(d.createdAt, lang),
      [headerMood]: `${m.emoji || ''} ${lang === 'en' ? (m.en || '') : (m.ko || '')}`.trim(),
      [headerWeather]: lang === 'en' ? (w.en || '') : (w.ko || ''),
      [col1]: d.lines[0] || '',
      [col2]: d.lines[1] || '',
      [col3]: d.lines[2] || '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows, { header: [headerDate, headerMood, headerWeather, col1, col2, col3] });
  ws['!cols'] = [{ wch: 24 }, { wch: 16 }, { wch: 12 }, { wch: 42 }, { wch: 42 }, { wch: 42 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, lang === 'en' ? 'Three Lines' : '오늘의 세 줄');
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `three-line-diary-${stamp}.xlsx`);
}

function shortDate(iso, lang) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (lang === 'en') {
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} · ${days[d.getDay()]} · ${hh}:${mm}`;
  }
  const days = ['일','월','화','수','목','금','토'];
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} · ${days[d.getDay()]} · ${hh}:${mm}`;
}
function relativeTime(iso, t) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return t.timeNow;
  if (min < 60) return `${min}${t.timeMin}`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}${t.timeHr}`;
  const day = Math.floor(hr / 24);
  return `${day}${t.timeDay}`;
}

function AuthScreen({ lang, setLang, onAuth, onToast }) {
  const t = I18N[lang];
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [contact, setContact] = useState('');
  const [err, setErr] = useState('');
  const [errField, setErrField] = useState('');
  const [busy, setBusy] = useState(false);

  function fail(msg, field) { setErr(msg); setErrField(field || ''); }

  async function submit(e) {
    e.preventDefault();
    setErr(''); setErrField('');
    const mail = email.trim().toLowerCase();
    if (!EMAIL_RE.test(mail)) return fail(t.errInvalidEmail, 'email');
    if (pw.length < 6) return fail(t.errShortPw, 'pw');

    setBusy(true);
    try {
      const users = loadUsers();
      const hash = await sha256(pw);
      if (mode === 'signup') {
        if (!contact.trim()) { setBusy(false); return fail(t.errContact, 'contact'); }
        if (users.some(u => u.email === mail)) { setBusy(false); return fail(t.errDup, 'email'); }
        const user = { email: mail, contact: contact.trim(), pwHash: hash, createdAt: new Date().toISOString() };
        saveUsers([...users, user]);
        localStorage.setItem(SESSION_KEY, mail);
        onToast(t.okSignup);
        onAuth(user);
      } else {
        const user = users.find(u => u.email === mail);
        if (!user) { setBusy(false); return fail(t.errNoUser, 'email'); }
        if (user.pwHash !== hash) { setBusy(false); return fail(t.errBadPw, 'pw'); }
        localStorage.setItem(SESSION_KEY, mail);
        onToast(t.okLogin);
        onAuth(user);
      }
    } catch (ex) {
      console.error(ex);
      fail('Error: ' + ex.message);
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <LangToggle lang={lang} setLang={setLang} variant="auth" />
        <div className="auth-head">
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 10 }}>
            <span className="mascot-wave"><Moody size={104} expr="happy" accent="#FF1B6B" accent2="#C77DFF" /></span>
          </div>
          <div className="auth-tag"><span className="dot"></span>{t.tag}</div>
          <div className="auth-title">{t.welcomePre}<span className="accent">{t.welcomeAccent}</span></div>
          <div className="auth-sub">{t.welcomeSub}</div>
        </div>
        <div className="auth-tabs">
          <button className={mode === 'login' ? 'on' : ''} onClick={() => { setMode('login'); setErr(''); }}>{t.tabLogin}</button>
          <button className={mode === 'signup' ? 'on' : ''} onClick={() => { setMode('signup'); setErr(''); }}>{t.tabSignup}</button>
        </div>
        <form onSubmit={submit} autoComplete="on">
          <div className={`auth-field ${errField === 'email' ? 'error' : ''}`}>
            <label>{t.fieldEmail}</label>
            <div className="input-wrap">
              <span className="auth-field-key">@</span>
              <input type="email" inputMode="email" autoComplete="email" placeholder={t.fieldEmailPh} value={email} onChange={e => setEmail(e.target.value)} />
            </div>
          </div>
          <div className={`auth-field ${errField === 'pw' ? 'error' : ''}`}>
            <label>{t.fieldPw}</label>
            <div className="input-wrap">
              <span className="auth-field-key">··</span>
              <input type="password" autoComplete={mode === 'login' ? 'current-password' : 'new-password'} placeholder={t.fieldPwPh} value={pw} onChange={e => setPw(e.target.value)} />
            </div>
          </div>
          {mode === 'signup' && (
            <div className={`auth-field ${errField === 'contact' ? 'error' : ''}`}>
              <label>{t.fieldContact}</label>
              <div className="input-wrap">
                <span className="auth-field-key">#</span>
                <input type="tel" inputMode="tel" autoComplete="tel" placeholder={t.fieldContactPh} value={contact} onChange={e => setContact(e.target.value)} />
              </div>
            </div>
          )}
          {err && <div className="auth-err">{err}</div>}
          <button className="auth-btn" type="submit" disabled={busy}>{mode === 'login' ? t.btnLogin : t.btnSignup}</button>
        </form>
        <div className="auth-foot">
          {mode === 'login'
            ? <>{t.footLoginAsk} <a onClick={() => { setMode('signup'); setErr(''); }}>{t.footLoginGo}</a></>
            : <>{t.footSignupAsk} <a onClick={() => { setMode('login'); setErr(''); }}>{t.footSignupGo}</a></>
          }
        </div>
        <div className="auth-note">{t.note}</div>
      </div>
    </div>
  );
}

function OpenCard({ entry, lang, t, onReact, onComment, currentEmail }) {
  const m = MOODS.find(x => x.id === entry.mood) || MOODS[0];
  const w = WEATHERS[entry.weatherIdx] || WEATHERS[0];
  const [commentText, setCommentText] = useState('');
  const author = anonName(entry.authorEmail, lang);
  const avatar = avatarEmoji(entry.authorEmail);
  const moodLabel = lang === 'en' ? m.en : m.ko;

  function submitComment(e) {
    e.preventDefault();
    if (!commentText.trim()) return;
    onComment(entry.id, commentText.trim());
    setCommentText('');
  }

  return (
    <article
      className="diary-card"
      style={{
        '--card-mood': m.color,
        '--card-mood-end': m.end,
        '--card-mood-shadow': hexToRgba(m.color, 0.35),
      }}
    >
      <div className="open-author">
        <div className="open-avatar">{avatar}</div>
        <div className="open-author-meta">
          <div className="open-author-name">{author}</div>
          <div className="open-author-time">{relativeTime(entry.createdAt, t)} · {lang === 'en' ? w.en : w.ko}</div>
        </div>
        <span className="open-mood-pill">{m.emoji} {moodLabel}</span>
      </div>

      {entry.lines.map((line, i) => line && (
        <div key={i} className="card-line">
          <div className="card-line-head">
            <span className="card-line-emoji">{t.lines[i].emoji}</span>
            <span>{t.lines[i].label}</span>
          </div>
          <div className="card-line-text">{line}</div>
        </div>
      ))}

      <div className="reactions">
        {REACTIONS.map(em => {
          const arr = (entry.reactions && entry.reactions[em]) || [];
          const cnt = Array.isArray(arr) ? arr.length : (typeof arr === 'number' ? arr : 0);
          const mine = Array.isArray(arr) && arr.includes(currentEmail);
          return (
            <button
              key={em}
              className={`react-btn ${mine ? 'mine' : ''}`}
              onClick={() => onReact(entry.id, em)}
              type="button"
            >
              <span className="e">{em}</span>
              <span>{cnt}</span>
            </button>
          );
        })}
      </div>

      <div className="comments">
        {(entry.comments || []).map(c => {
          const name = c.authorName || c.author || '?';
          return (
            <div key={c.id} className="comment">
              <div className="c-avatar">{(name[0] || '?').toUpperCase()}</div>
              <div className="c-body">
                <div className="c-meta"><span className="c-name">{name}</span> · {relativeTime(c.createdAt, t)}</div>
                <div className="c-text">{c.text}</div>
              </div>
            </div>
          );
        })}
        <form className="comment-form" onSubmit={submitComment}>
          <input
            type="text"
            maxLength={140}
            placeholder={t.commentPh}
            value={commentText}
            onChange={e => setCommentText(e.target.value)}
          />
          <button type="submit" disabled={!commentText.trim()}>{t.commentSend}</button>
        </form>
      </div>
    </article>
  );
}

function DiaryApp({ user, onLogout, lang, setLang, onToast }) {
  const t = I18N[lang];

  const [view, setView] = useState('mine'); // 'mine' | 'open'
  const [activeCat, setActiveCat] = useState('bright');
  const [mood, setMood] = useState(null);
  const [lines, setLines] = useState(['', '', '']);
  const [weatherIdx, setWeatherIdx] = useState(0);
  const [shareOnSave, setShareOnSave] = useState(false);
  const [entryDate, setEntryDate] = useState(todayInputValue());

  const [diaries, setDiaries] = useState([]);
  const [openEntries, setOpenEntries] = useState([]);

  // local diaries load
  useEffect(() => {
    try {
      const userKey = diaryKey(user.email);
      const raw = localStorage.getItem(userKey);
      if (raw) {
        setDiaries(JSON.parse(raw));
      } else {
        const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
        if (legacy) {
          localStorage.setItem(userKey, legacy);
          localStorage.removeItem(STORAGE_KEY_LEGACY);
          setDiaries(JSON.parse(legacy));
        }
      }
      const cached = loadOpen();
      if (cached && cached.length) setOpenEntries(cached);
    } catch (e) {}
  }, [user.email]);

  useEffect(() => {
    localStorage.setItem(diaryKey(user.email), JSON.stringify(diaries));
  }, [diaries, user.email]);

  // Pantry sync: initial seed + 5s polling
  useEffect(() => {
    let cancelled = false;
    async function load(isInit) {
      const data = await pantryGet();
      if (cancelled) return;
      if (data && Array.isArray(data.entries)) {
        setOpenEntries(data.entries);
        saveOpen(data.entries);
      } else if (isInit) {
        const seed = makeSeedEntries();
        const ok = await pantryPut({ entries: seed, updatedAt: Date.now() });
        if (!cancelled && ok) {
          setOpenEntries(seed);
          saveOpen(seed);
        }
      }
    }
    load(true);
    const id = setInterval(() => load(false), POLL_MS);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  const moodObj = MOODS.find(m => m.id === mood);
  const cssVars = useMemo(() => moodObj ? {
    '--mood-color': moodObj.color,
    '--mood-end': moodObj.end,
  } : {}, [moodObj]);

  const canSave = mood && lines.some(l => l.trim().length > 0);

  async function handleSave() {
    if (!canSave) return;
    const id = Date.now();
    // entryDate(YYYY-MM-DD) + 현재 시각으로 createdAt 구성
    const now = new Date();
    const [yy, mm, dd] = entryDate.split('-').map(Number);
    const dt = new Date(yy, mm - 1, dd, now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    const createdAt = dt.toISOString();
    const entry = {
      id, mood, weatherIdx,
      lines: lines.map(l => l.trim()),
      createdAt,
      shared: shareOnSave,
    };
    const newDiaries = [entry, ...diaries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    setDiaries(newDiaries);

    if (shareOnSave) {
      const openEntry = {
        id,
        authorEmail: user.email,
        mood, weatherIdx,
        lines: entry.lines,
        createdAt,
        reactions: {}, comments: [],
      };
      const newOpen = [openEntry, ...openEntries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setOpenEntries(newOpen);
      saveOpen(newOpen);
      pantryPut({ entries: newOpen, updatedAt: Date.now() });
      onToast(t.sharedToast);
    } else {
      onToast(t.toast);
    }

    setMood(null);
    setLines(['', '', '']);
    setShareOnSave(false);
    setEntryDate(todayInputValue());
  }

  function handleDelete(id) {
    if (!confirm(t.confirmDel)) return;
    setDiaries(diaries.filter(d => d.id !== id));
    const wasShared = openEntries.some(o => o.id === id && o.authorEmail === user.email);
    if (wasShared) {
      const newOpen = openEntries.filter(o => !(o.id === id && o.authorEmail === user.email));
      setOpenEntries(newOpen);
      saveOpen(newOpen);
      pantryPut({ entries: newOpen, updatedAt: Date.now() });
    }
  }

  function handleShareExisting(id) {
    const d = diaries.find(x => x.id === id);
    if (!d) return;
    if (openEntries.some(o => o.id === id)) return;
    const openEntry = {
      id: d.id,
      authorEmail: user.email,
      mood: d.mood, weatherIdx: d.weatherIdx,
      lines: d.lines,
      createdAt: d.createdAt,
      reactions: {}, comments: [],
    };
    const newOpen = [openEntry, ...openEntries];
    setOpenEntries(newOpen);
    saveOpen(newOpen);
    setDiaries(diaries.map(x => x.id === id ? { ...x, shared: true } : x));
    pantryPut({ entries: newOpen, updatedAt: Date.now() });
    onToast(t.sharedToast);
  }

  function handleReact(openId, emoji) {
    const newOpen = openEntries.map(o => {
      if (o.id !== openId) return o;
      const reactions = { ...(o.reactions || {}) };
      const arr = Array.isArray(reactions[emoji]) ? [...reactions[emoji]] : [];
      if (arr.includes(user.email)) {
        reactions[emoji] = arr.filter(e => e !== user.email);
      } else {
        arr.push(user.email);
        reactions[emoji] = arr;
      }
      return { ...o, reactions };
    });
    setOpenEntries(newOpen);
    saveOpen(newOpen);
    pantryPut({ entries: newOpen, updatedAt: Date.now() });
  }

  function handleComment(openId, text) {
    const newOpen = openEntries.map(o => {
      if (o.id !== openId) return o;
      const comments = [...(o.comments || []), {
        id: Date.now(),
        authorEmail: user.email,
        authorName: anonName(user.email, lang),
        text,
        createdAt: new Date().toISOString(),
      }];
      return { ...o, comments };
    });
    setOpenEntries(newOpen);
    saveOpen(newOpen);
    pantryPut({ entries: newOpen, updatedAt: Date.now() });
  }

  function handleLogout() {
    if (!confirm(t.confirmLogout)) return;
    onLogout();
  }

  const initial = (user.email[0] || '?').toUpperCase();

  // moods filtered by active category
  const visibleMoods = MOODS.filter(m => m.cat === activeCat);
  const catObj = MOOD_CATS.find(c => c.id === activeCat) || MOOD_CATS[0];

  return (
    <div style={cssVars}>
      <header className="top">
        <div className="user-chip">
          <span className="user-avatar">{initial}</span>
          <span className="user-mail">{user.email}</span>
          <button className="logout-btn" onClick={handleLogout}>{t.logout}</button>
        </div>
        <LangToggle lang={lang} setLang={setLang} />
        <div className="head-tag"><span className="dot"></span>{t.tag}</div>
        <h1>{t.titlePre} <span className="accent">{t.titleAccent}</span></h1>
        <div className="sub">{t.sub}</div>
        <div className="header-mascot mascot-wave">
          <Moody
            size={76}
            expr={moodObj ? (moodObj.cat === 'heavy' ? 'sad' : moodObj.cat === 'hazy' ? 'hazy' : moodObj.cat === 'calm' ? 'wink' : 'love') : 'happy'}
            accent={moodObj ? moodObj.color : '#FF1B6B'}
            accent2={moodObj ? moodObj.end : '#C77DFF'}
          />
        </div>
      </header>

      {/* View tabs */}
      <div className="view-tabs" role="tablist">
        <button className={view === 'mine' ? 'on' : ''} onClick={() => setView('mine')}>
          <span>{t.viewMine}</span>
          <span className="cnt">{String(diaries.length).padStart(2, '0')}</span>
        </button>
        <button className={view === 'open' ? 'on' : ''} onClick={() => setView('open')}>
          <span className="live-dot"></span>
          <span>{t.viewOpen}</span>
          <span className="cnt">{String(openEntries.length).padStart(2, '0')}</span>
        </button>
      </div>

      {view === 'mine' && (
        <>
          <section className="mood-picker glass">
            <div className="mood-label">
              <span className="l">{t.moodLabel}</span>
              <span className="r">{t.moodLabelSub}</span>
            </div>

            <div className="mood-cats">
              {MOOD_CATS.map(c => (
                <button
                  key={c.id}
                  className={`mood-cat ${activeCat === c.id ? 'on' : ''}`}
                  style={{
                    '--cat-color': c.color,
                    '--cat-end': c.end,
                    '--cat-shadow': hexToRgba(c.color, 0.3),
                  }}
                  onClick={() => setActiveCat(c.id)}
                  type="button"
                >
                  <span className="cat-emoji">{c.emoji}</span>
                  <span>{lang === 'en' ? c.en : c.ko}</span>
                  <span className="cat-count">12</span>
                </button>
              ))}
            </div>

            <div className="mood-grid">
              {visibleMoods.map(m => (
                <button
                  key={m.id}
                  className={`mood-btn ${mood === m.id ? 'active' : ''}`}
                  style={{
                    '--mood-color': m.color,
                    '--mood-end': m.end,
                    '--mood-color-shadow': hexToRgba(m.color, 0.35),
                  }}
                  onClick={() => setMood(m.id)}
                  type="button"
                  aria-label={lang === 'en' ? m.en : m.ko}
                >
                  <span className="emoji">{m.emoji}</span>
                  <span className="name">{lang === 'en' ? m.en : m.ko}</span>
                </button>
              ))}
            </div>
          </section>

          <section className={`write-card glass ${mood ? 'has-mood' : ''}`}>
            <div className="date-row">
              <input
                type="date"
                className={`today${entryDate !== todayInputValue() ? ' past' : ''}`}
                value={entryDate}
                max={todayInputValue()}
                onChange={e => setEntryDate(e.target.value || todayInputValue())}
                aria-label="entry date"
                title={lang === 'en' ? 'Pick a date (past dates OK)' : '날짜 선택 (지난 날짜도 OK)'}
              />
              <select className="weather" value={weatherIdx} onChange={e => setWeatherIdx(Number(e.target.value))}>
                {WEATHERS.map((w, i) => <option key={i} value={i}>{lang === 'en' ? w.en : w.ko}</option>)}
              </select>
            </div>

            {t.lines.map((meta, i) => (
              <div key={i} className="line-input">
                <div className="line-head">
                  <span className="num">{String(i+1).padStart(2,'0')}</span>
                  <span className="line-emoji">{meta.emoji}</span>
                  <span className="line-name">{meta.label}</span>
                  {meta.hint && <span className="line-hint">({meta.hint})</span>}
                </div>
                <input
                  type="text"
                  maxLength={120}
                  placeholder={meta.placeholder}
                  value={lines[i]}
                  onChange={e => {
                    const next = [...lines];
                    next[i] = e.target.value;
                    setLines(next);
                  }}
                />
              </div>
            ))}

            <div
              className={`share-toggle ${shareOnSave ? 'on' : ''}`}
              onClick={() => setShareOnSave(!shareOnSave)}
              role="checkbox"
              aria-checked={shareOnSave}
              tabIndex={0}
              onKeyDown={e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setShareOnSave(!shareOnSave); } }}
            >
              <div className="box"></div>
              <div className="info">
                <div className="info-l">{t.shareLabel}</div>
                <div className="info-s">{t.shareSub}</div>
              </div>
            </div>

            <button
              className={`save-btn ${canSave ? 'ready' : ''}`}
              onClick={handleSave}
              disabled={!canSave}
            >
              <span>{canSave ? t.saveReady : mood ? t.saveNoLine : t.saveNoMood}</span>
              {canSave && <span className="arrow">→</span>}
            </button>
          </section>

          <div className="list-title">
            <h2>{t.listTitle}</h2>
            <span className="count">{String(diaries.length).padStart(2, '0')}</span>
            <div className="exports">
              <button
                onClick={() => exportToPdf(diaries, lang, t, user.email)}
                disabled={diaries.length === 0}
                title={lang === 'en' ? 'Download as PDF (browser print)' : 'PDF로 다운로드 (브라우저 인쇄)'}
              >
                {t.exportPdf}
              </button>
              <button
                onClick={() => exportToXlsx(diaries, lang, t)}
                disabled={diaries.length === 0}
                title={lang === 'en' ? 'Download as Excel (.xlsx)' : '엑셀(.xlsx)로 다운로드'}
              >
                {t.exportXlsx}
              </button>
            </div>
          </div>

          {diaries.length === 0 ? (
            <div className="empty">
              <div style={{ display: 'inline-block', position: 'relative', marginBottom: 16 }}>
                <span className="mascot-sleep"><Moody size={130} expr="sleepy" accent="#C77DFF" accent2="#3D5AFE" /></span>
                <span className="mascot-zzz" style={{ top: 6, right: 4 }}>z</span>
                <span className="mascot-zzz" style={{ top: 18, right: 14, fontSize: 14, animationDelay: '0.8s' }}>z</span>
                <span className="mascot-zzz" style={{ top: 28, right: 22, fontSize: 12, animationDelay: '1.6s' }}>z</span>
              </div>
              <div className="l1">{t.emptyLine1}</div>
              <div className="l2">{t.emptyLine2}</div>
            </div>
          ) : (
            diaries.map(d => {
              const m = MOODS.find(x => x.id === d.mood) || MOODS[0];
              const w = WEATHERS[d.weatherIdx] || WEATHERS[0];
              const moodPhrase = lang === 'en'
                ? `${m.moodLineEn} ${t.moodDaySuffix}`
                : `${m.moodLineKo} ${t.moodDaySuffix}`;
              const isShared = d.shared || openEntries.some(o => o.id === d.id);
              return (
                <article
                  key={d.id}
                  className="diary-card"
                  style={{
                    '--card-mood': m.color,
                    '--card-mood-end': m.end,
                    '--card-mood-shadow': hexToRgba(m.color, 0.35),
                  }}
                >
                  <div className="card-head">
                    <div className="card-mood-bubble">{m.emoji}</div>
                    <div className="card-meta">
                      <div className="card-date">{shortDate(d.createdAt, lang)} · {lang === 'en' ? w.en : w.ko}</div>
                      <div className="card-mood-name">{moodPhrase}</div>
                    </div>
                    <div className="card-actions">
                      <button
                        className={`share-pill ${isShared ? 'shared' : ''}`}
                        onClick={() => !isShared && handleShareExisting(d.id)}
                        disabled={isShared}
                        title={isShared ? t.sharedBadge : t.shareBtn}
                      >
                        {isShared ? t.sharedBadge : t.shareBtn}
                      </button>
                      <button className="del-btn" onClick={() => handleDelete(d.id)} title={t.delTitle}>✕</button>
                    </div>
                  </div>
                  {d.lines.map((line, i) => line && (
                    <div key={i} className="card-line">
                      <div className="card-line-head">
                        <span className="card-line-emoji">{t.lines[i].emoji}</span>
                        <span>{t.lines[i].label}</span>
                      </div>
                      <div className="card-line-text">{line}</div>
                    </div>
                  ))}
                </article>
              );
            })
          )}
        </>
      )}

      {view === 'open' && (
        <>
          <div className="list-title">
            <h2>{t.openTitle}</h2>
            <span className="count">{String(openEntries.length).padStart(2, '0')}</span>
          </div>
          <div style={{ marginBottom: 18, marginLeft: 4, fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-mute)', letterSpacing: 0.5 }}>
            {t.openSub}
          </div>

          {openEntries.length === 0 ? (
            <div className="empty">
              <div style={{ display: 'inline-block', marginBottom: 16 }}>
                <span className="mascot-wave"><Moody size={130} expr="wink" accent="#00D9FF" accent2="#00E5A0" /></span>
              </div>
              <div className="l1">{t.emptyOpen1}</div>
              <div className="l2">{t.emptyOpen2}</div>
            </div>
          ) : (
            openEntries.map(entry => (
              <OpenCard
                key={entry.id}
                entry={entry}
                lang={lang}
                t={t}
                onReact={handleReact}
                onComment={handleComment}
                currentEmail={user.email}
              />
            ))
          )}
        </>
      )}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(() => {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === 'ko' || saved === 'en') return saved;
      return (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en';
    } catch (e) { return 'ko'; }
  });

  const [user, setUser] = useState(null);
  const [toast, setToast] = useState('');

  useEffect(() => {
    try {
      const email = localStorage.getItem(SESSION_KEY);
      if (!email) return;
      const found = loadUsers().find(u => u.email === email);
      if (found) setUser(found);
    } catch (e) {}
  }, []);

  useEffect(() => {
    localStorage.setItem(LANG_KEY, lang);
    document.documentElement.lang = I18N[lang].htmlLang;
    document.title = lang === 'en' ? "Three Lines · Daily Mood Log" : "오늘의 세 줄 · 데일리 무드 로그";
  }, [lang]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(''), 1700);
  }

  function handleLogout() {
    localStorage.removeItem(SESSION_KEY);
    setUser(null);
  }

  return (
    <>
      {toast && <div className="toast">{toast}</div>}
      {user
        ? <DiaryApp user={user} onLogout={handleLogout} lang={lang} setLang={setLang} onToast={showToast} />
        : <AuthScreen lang={lang} setLang={setLang} onAuth={setUser} onToast={showToast} />
      }
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
